[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ambidex-harness"
version = "0.1.0"
description = "Authorship verification benchmark harness: distance measures, unmasking, impostors, calibrated fusion and thresholds (stylometric privacy research instrument)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ambidex = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
